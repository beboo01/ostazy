<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أستاذي لإدارة المجموعات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F1;--card:#fff;--ink:#12363A;--mute:#5B7275;--line:#D9E2DE;--acc:#12363A;--onacc:#fff;--ok:#1E8E5A;--okbg:#DDF1E6;--bad:#C2410C;--badbg:#FCE5DA;--warn:#B7791F;--warnbg:#FBF0D5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1B;--card:#172628;--ink:#E4EFEC;--mute:#93AAAD;--line:#264043;--acc:#5FD0A5;--onacc:#0F1A1B;--ok:#5FD0A5;--okbg:#17382C;--bad:#F29265;--badbg:#3D2418;--warn:#E8B95A;--warnbg:#3A2F14}}
:root[data-theme="dark"]{--bg:#0F1A1B;--card:#172628;--ink:#E4EFEC;--mute:#93AAAD;--line:#264043;--acc:#5FD0A5;--onacc:#0F1A1B;--ok:#5FD0A5;--okbg:#17382C;--bad:#F29265;--badbg:#3D2418;--warn:#E8B95A;--warnbg:#3A2F14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:25px;font-weight:800;margin:6px 0 2px}h2{font-size:17px;font-weight:800;margin:0 0 8px}
p{margin:0 0 10px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{min-height:64px}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--acc);color:var(--onacc)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:5px 11px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.fx{flex:none}
.tabs{display:flex;gap:5px;margin:12px 0;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;background:var(--card);color:var(--mute);border:1px solid var(--line);padding:8px 10px}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.stu{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.stu:first-of-type{border-top:0}
.tag{display:inline-block;border-radius:99px;padding:1px 11px;font-size:13px;font-weight:600}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
a.wa{display:inline-block;text-decoration:none;background:var(--ok);color:var(--onacc);border-radius:10px;padding:5px 11px;font-size:14px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat strong{display:block;font-size:21px;font-weight:800}.stat span{font-size:13px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:16px;text-align:center}
.sc{width:80px;padding:5px 8px}
.hide{display:none}
.pay{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.pm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:600;background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{display:inline-flex;align-items:center;gap:4px;margin:0;font-weight:600;font-size:14px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--bg)}.chip input{width:auto}
.brand{font-size:24px;font-weight:800;padding:4px 0 12px;margin-bottom:14px;border-bottom:1px solid var(--line)}.brand span{color:var(--mute);font-weight:600;font-size:18px}
</style>
</head>
<body>
<main>
<header class="brand">أستاذي <span>لإدارة المجموعات</span></header>
<p id="sync" role="status" aria-live="polite"></p>
<div id="syncTools" class="card hide"><div class="btns">
<button type="button" class="ghost sm" id="retrySave">حاول الحفظ</button>
<button type="button" class="ghost sm" id="reloadData">إعادة تحميل البيانات</button>
<button type="button" class="ghost sm" id="downloadAll">نسخة احتياطية</button>
</div><label for="restorePick">استعادة نسخة JSON (بحد أقصى 5 ميجابايت)</label><input id="restorePick" type="file" accept="application/json,.json"><small>النسخة تحتوي بيانات طلابك. احفظها في مكان خاص وآمن.</small></div>
<section id="auth" class="hide"><h1>سجّل دخولك</h1><p>بياناتك خاصة بيك ومتزامنة على كل أجهزتك.</p><div class="card"><label for="aem">الإيميل</label><input id="aem" type="email" autocomplete="email"><label for="apw">الباسورد (6 حروف على الأقل)</label><input id="apw" type="password" autocomplete="current-password"><div class="row" style="margin-top:12px"><button id="li" type="button">دخول</button><button class="ghost" id="su" type="button">حساب جديد</button></div><p id="amsg" role="status" style="margin:10px 0 0"></p></div></section>
<section id="wiz" class="hide">
  <h1>جهّز مجموعاتك في دقيقتين</h1>
  <p>ثلاث أسئلة بس، والباقي علينا.</p>
  <div class="card"><h2 id="wt"></h2><div id="wb"></div>
    <div class="row" style="margin-top:14px"><button class="ghost" id="back" type="button">رجوع</button><button id="next" type="button">التالي</button></div>
  </div>
</section>
<section id="app" class="hide">
  <div class="row" style="justify-content:space-between"><div><h1 id="ttl"></h1><p id="sub" style="margin:0"></p></div></div>
  <div id="bill"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
  <p class="note" id="stor"></p><p class="note"><button class="ghost sm" id="out" type="button">تسجيل خروج</button></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
