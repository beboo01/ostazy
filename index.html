<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أستاذي لإدارة المجموعات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F7;--card:#fff;--field:#fff;--ink:#10203A;--mute:#5D6E88;--line:#E2E8F2;--acc:#2563EB;--accd:#1D4ED8;--onacc:#fff;--navy:#12315E;--navy2:#0C2247;--navtx:#B9CBE6;--ok:#15803D;--okbg:#DCFCE7;--bad:#DC2626;--badbg:#FEE2E2;--warn:#B45309;--warnbg:#FEF3C7;--sh:0 1px 2px rgba(16,32,58,.05),0 6px 20px rgba(16,32,58,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--card:#101E33;--field:#0B1830;--ink:#E6EEF9;--mute:#8CA1BF;--line:#20334F;--acc:#3B82F6;--accd:#2563EB;--onacc:#fff;--navy:#0D1F3C;--navy2:#091831;--navtx:#8CA6CC;--ok:#4ADE80;--okbg:#122E1E;--bad:#F87171;--badbg:#3A1416;--warn:#FBBF24;--warnbg:#37280A;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0A1424;--card:#101E33;--field:#0B1830;--ink:#E6EEF9;--mute:#8CA1BF;--line:#20334F;--acc:#3B82F6;--accd:#2563EB;--onacc:#fff;--navy:#0D1F3C;--navy2:#091831;--navtx:#8CA6CC;--ok:#4ADE80;--okbg:#122E1E;--bad:#F87171;--badbg:#3A1416;--warn:#FBBF24;--warnbg:#37280A;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:24px;font-weight:800;margin:6px 0 2px}h2{font-size:17px;font-weight:800;margin:0 0 8px}
p{margin:0 0 10px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:3px solid color-mix(in srgb,var(--acc) 22%,transparent);outline-offset:0}
textarea{min-height:64px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--acc);color:var(--onacc);transition:background .15s ease,transform .05s ease}
button:hover{background:var(--accd)}
button:active{transform:translateY(1px)}
button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{background:var(--bg)}
button.sm{padding:5px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.fx{flex:none}
.brand{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;font-size:23px;font-weight:800;border-radius:16px;box-shadow:var(--sh);padding:14px 18px;margin-bottom:14px;display:flex;align-items:baseline;gap:8px}
.brand span{color:var(--navtx);font-weight:600;font-size:15px}
#sync{font-size:13px;margin:0 4px 10px}
.side{margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.tabs button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:transparent;color:var(--mute);border:0;border-radius:10px;padding:8px 12px;font-weight:600}
.tabs button:hover{background:var(--bg);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--onacc)}
.tabs button svg{flex:none}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:18px;box-shadow:var(--sh);padding:20px 18px;margin-bottom:14px}
.hero h2{color:#fff;font-size:22px;margin:0}
.hero .hd{color:var(--navtx);font-size:13.5px;margin:2px 0 14px;font-weight:600}
.hero .stats{margin-bottom:0}
.hero .stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);box-shadow:none}
.hero .stat::before{display:none}
.hero .stat strong{color:#fff}
.hero .stat span{color:var(--navtx)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px 12px 12px;text-align:center}
.stat::before{content:"";position:absolute;inset-inline-start:0;inset-inline-end:0;top:0;height:4px;background:var(--acc)}
.stat:nth-child(6n+2)::before{background:#10B981}.stat:nth-child(6n+3)::before{background:#F97316}.stat:nth-child(6n+4)::before{background:#A855F7}.stat:nth-child(6n+5)::before{background:#14B8A6}.stat:nth-child(6n)::before{background:#EF4444}
.stat strong{display:block;font-size:20px;font-weight:800}.stat span{font-size:12.5px;color:var(--mute);font-weight:600}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-radius:14px;padding:14px;color:#fff;text-align:start;box-shadow:var(--sh)}
.qa svg{margin-bottom:6px}
.qa b{font-size:15px;font-weight:800}
.qa span{font-size:12.5px;opacity:.85;font-weight:600}
.qa:hover{filter:brightness(1.06)}
.qa-b{background:linear-gradient(135deg,#2B6BF0,#1D4ED8)}
.qa-g{background:linear-gradient(135deg,#14B8A6,#0D9488)}
.qa-o{background:linear-gradient(135deg,#FB923C,#EA580C)}
.qa-p{background:linear-gradient(135deg,#A855F7,#9333EA)}
.stu{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.stu:first-of-type{border-top:0}
.tag{display:inline-block;border-radius:99px;padding:1px 11px;font-size:12.5px;font-weight:700}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
a.wa{display:inline-block;text-decoration:none;background:#16A34A;color:#fff;border-radius:10px;padding:5px 12px;font-size:14px;font-weight:700}
a.wa:hover{background:#15803D}
.note{font-size:13px;color:var(--mute);margin-top:16px;text-align:center}
.sc{width:80px;padding:5px 8px}
.hide{display:none}
.pay{margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}.pm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-weight:600;background:var(--field)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{display:inline-flex;align-items:center;gap:4px;margin:0;font-weight:600;font-size:14px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--field)}.chip input{width:auto}
#auth .card,#wiz .card{max-width:460px;margin-inline:auto}
@media(min-width:900px){
main{max-width:1200px;padding:20px 24px 56px}
#app:not(.hide){display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:20px;margin-bottom:0;background:linear-gradient(180deg,var(--navy),var(--navy2));border-radius:18px;box-shadow:var(--sh);padding:14px 10px}
.tabs{flex-direction:column;background:transparent;border:0;box-shadow:none;overflow:visible;padding:0}
.tabs button{width:100%;justify-content:flex-start;color:var(--navtx);padding:10px 14px;font-size:15px}
.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
.tabs button[aria-selected="true"]{background:var(--acc);color:#fff}
.stats{gap:12px}
.qgrid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<main>
<header class="brand">أستاذي <span>لإدارة المجموعات</span></header>
<p id="sync" role="status" aria-live="polite"></p>
<div id="syncTools" class="card hide"><div class="btns">
<button type="button" class="ghost sm" id="retrySave">حاول الحفظ</button>
<button type="button" class="ghost sm" id="reloadData">إعادة تحميل البيانات</button>
<button type="button" class="ghost sm" id="downloadAll">نسخة احتياطية</button>
</div><label for="restorePick">استعادة نسخة JSON (بحد أقصى 5 ميجابايت)</label><input id="restorePick" type="file" accept="application/json,.json"><small>النسخة تحتوي بيانات طلابك. احفظها في مكان خاص وآمن.</small></div>
<section id="auth" class="hide"><h1>سجّل دخولك</h1><p>بياناتك خاصة بيك ومتزامنة على كل أجهزتك.</p><div class="card"><label for="aem">الإيميل</label><input id="aem" type="email" autocomplete="email"><label for="apw">الباسورد (6 حروف على الأقل)</label><input id="apw" type="password" autocomplete="current-password"><div class="row" style="margin-top:12px"><button id="li" type="button">دخول</button><button class="ghost" id="su" type="button">حساب جديد</button></div><p id="amsg" role="status" style="margin:10px 0 0"></p></div></section>
<section id="wiz" class="hide">
  <h1>جهّز مجموعاتك في دقيقتين</h1>
  <p>ثلاث أسئلة بس، والباقي علينا.</p>
  <div class="card"><h2 id="wt"></h2><div id="wb"></div>
    <div class="row" style="margin-top:14px"><button class="ghost" id="back" type="button">رجوع</button><button id="next" type="button">التالي</button></div>
  </div>
</section>
<section id="app" class="hide">
  <nav class="side" aria-label="أقسام التطبيق"><div class="tabs" role="tablist" id="tabs"></div></nav>
  <div class="content">
    <div class="row" style="justify-content:space-between"><div><h1 id="ttl"></h1><p id="sub" style="margin:0"></p></div></div>
    <div id="bill"></div>
    <div id="view"></div>
    <p class="note" id="stor"></p><p class="note"><button class="ghost sm" id="out" type="button">تسجيل خروج</button></p>
  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
